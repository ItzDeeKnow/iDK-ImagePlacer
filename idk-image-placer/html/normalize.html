<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    /* never actually shown - this DUI is only ever used headlessly to run
       the browser's own image decoder, not rendered as a texture */
    html, body { margin: 0; padding: 0; background: transparent; }
</style>
</head>
<body>
<canvas id="c" style="display:none"></canvas>
<script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    // GetParentResourceName() isn't guaranteed to exist inside a DUI (it's
    // reliably present in the main NUI frame, but this page is loaded
    // headlessly via CreateDui) - fall back to parsing it out of our own
    // hostname, which is always "cfx-nui-<resource>" for a page served
    // through the resource's own files{}.
    function resolveResourceName() {
        if (typeof GetParentResourceName === 'function') {
            try { return GetParentResourceName(); } catch (e) { /* fall through */ }
        }
        const m = location.hostname.match(/^cfx-nui-(.+)$/);
        return m ? m[1] : location.hostname;
    }
    const RESOURCE_NAME = resolveResourceName();

    function reply(requestId, success, dataUrl) {
        fetch(`https://${RESOURCE_NAME}/normalizeImageResult`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json; charset=UTF-8' },
            body: JSON.stringify({ requestId, success, dataUrl: dataUrl || null })
        }).catch(() => {});
    }

    window.addEventListener('message', (event) => {
        const data = event.data;
        if (!data || data.type !== 'normalize') return;
        const requestId = data.requestId;

        const img = new Image();
        img.onload = () => {
            try {
                // naturalWidth/naturalHeight (and how the browser paints
                // the image) already reflect the EXIF orientation tag -
                // drawing straight into a canvas of that size bakes the
                // correction into plain, orientation-less pixels.
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                const out = canvas.toDataURL('image/png');
                reply(requestId, true, out);
            } catch (e) {
                reply(requestId, false, null);
            }
        };
        img.onerror = () => reply(requestId, false, null);
        img.src = data.url;
    });
</script>
</body>
</html>
